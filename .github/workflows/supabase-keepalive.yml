name: Keep Supabase Alive

on:
  schedule:
    # Ejecuta cada 4 días a las 12:00 UTC para evitar la pausa tras 7 días de inactividad
    - cron: '0 12 */4 * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    steps:
      - name: Verificar secretos requeridos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Error: Debes configurar los secrets SUPABASE_URL y SUPABASE_KEY en GitHub."
            exit 1
          fi

      - name: Ping a la API REST de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          BASE_URL="$(printf '%s' "$SUPABASE_URL" | tr -d ' \r\n"'\''')"
          BASE_URL="${BASE_URL%/}"
          API_KEY="$(printf '%s' "$SUPABASE_KEY" | tr -d ' \r\n"'\''')"

          if [[ ! "$BASE_URL" =~ ^https?:// ]]; then
            echo "Error: SUPABASE_URL debe comenzar con https:// (ej: https://tu-proyecto.supabase.co)."
            exit 1
          fi

          AUTH_ARGS=(-H "apikey: ${API_KEY}")
          if [[ "$API_KEY" == eyJ* ]]; then
            AUTH_ARGS+=(-H "Authorization: Bearer ${API_KEY}")
          fi

          HTTP_CODE=$(curl -sS -o /tmp/supabase_resp.txt -w "%{http_code}" \
            "${BASE_URL}/rest/v1/solicitudes?select=id&limit=1" \
            "${AUTH_ARGS[@]}")

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Error al consultar Supabase (HTTP $HTTP_CODE):"
            cat /tmp/supabase_resp.txt
            echo ""
            exit 1
          fi

          echo "Ping exitoso a Supabase (HTTP $HTTP_CODE)."
