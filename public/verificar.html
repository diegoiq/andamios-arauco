<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificación de Andamio - ARAUCO Planta Industrial</title>
  <link rel="stylesheet" href="/styles.css?v=1.0.2">
  <style>
    body {
      background-color: #0b1329;
      color: #f8fafc;
      padding: 1rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .verify-card {
      max-width: 600px;
      margin: 1rem auto;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .verify-header {
      background: #1b4332;
      border-bottom: 3px solid #52b788;
      padding: 1.25rem;
      text-align: center;
    }
    .status-banner {
      padding: 1rem;
      text-align: center;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .status-banner.habilitado {
      background: #2d6a4f;
      color: #d8f3dc;
    }
    .status-banner.alquiler {
      background: #b45309;
      color: #fef3c7;
    }
    .status-banner.desarme {
      background: #991b1b;
      color: #fee2e2;
    }
    .status-banner.deshabilitado-hse {
      background: #dc2626;
      color: #ffffff;
      border-bottom: 3px solid #f87171;
      font-size: 1.15rem;
      letter-spacing: 0.8px;
      animation: pulseAlert 1.5s infinite;
    }
    @keyframes pulseAlert {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(0.99); }
    }
    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      padding: 1.25rem;
    }
    .data-cell {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0.75rem;
    }
    .data-cell.full {
      grid-column: span 2;
    }
    .cell-label {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.25rem;
    }
    .cell-value {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f8fafc;
    }
    .checklist-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .checklist-item {
      display: flex;
      gap: 0.5rem;
      align-items: flex-start;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.82rem;
    }
  </style>
</head>
<body>

  <div class="verify-card" id="mainContainer">
    <div class="verify-header">
      <span class="brand-badge" style="background: #fff; color: #000; font-weight: 900; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 1.2rem;">arauco</span>
      <h2 style="margin-top: 0.5rem; font-size: 1.2rem; color: #fff;">Auditoría de Andamio en Planta</h2>
      <p style="color: #52b788; font-size: 0.8rem; margin-top: 0.2rem;">SISTEMA OFICIAL DE PROVISIÓN Y TRAZABILIDAD N° 01-XXXXXXXX</p>
    </div>

    <div id="contentArea">
      <div style="text-align: center; padding: 3rem; color: #94a3b8;">
        <div style="font-size: 2rem; margin-bottom: 0.5rem;">⏳</div>
        Consultando información del andamio...
      </div>
    </div>
  </div>

  <div style="text-align: center; margin-top: 1.5rem; font-size: 0.8rem; color: #64748b;">
    ARAUCO Planta Industrial · Trazabilidad de Andamios por Código QR · <a href="/" style="color: #52b788; text-decoration: none;">Ingresar a la PWA</a>
  </div>

  <script>
    const CHECKLIST_TEXTOS = [
      "Bases de apoyo fijas/regulables o husillos reglamentarios",
      "Plataformas apoyadas sobre estructura propia (no cañerías/bandejas)",
      "Doble baranda a 50 cm y 100 cm de altura",
      "Rodapiés en todo el perímetro de la plataforma",
      "Tablones metálicos antideslizantes con seguro anti-desplazamiento",
      "Ascenso y descenso por el interior de la estructura",
      "Puerta o compuerta de acceso a la plataforma",
      "Escaleras marineras externas atadas en extremos autorizados",
      "Acceso mediante escalera interna inclinada reglamentaria",
      "Cartel físico de habilitación colocado en lugar visible",
      "Aberturas rebatibles (escotillas) operativas y cerradas"
    ];

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');

      if (!id) {
        document.getElementById('contentArea').innerHTML = `
          <div style="padding: 2rem; text-align: center; color: #ef4444;">
            <h3>⚠️ Código de andamio no especificado</h3>
            <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 0.5rem;">Escanee el código QR impreso en la tarjeta física del andamio para auditarlo.</p>
            <a href="/" class="btn" style="margin-top: 1rem; display: inline-block; background: #2d6a4f; color: #fff; padding: 0.5rem 1rem; border-radius: 6px; text-decoration: none;">Ir al Inicio</a>
          </div>
        `;
        return;
      }

      try {
        const res = await fetch('/api/solicitudes/verificar/' + encodeURIComponent(id)).then(r => r.json());
        if (!res.ok || !res.solicitud) {
          document.getElementById('contentArea').innerHTML = `
            <div style="padding: 2rem; text-align: center; color: #ef4444;">
              <h3>❌ Andamio no encontrado</h3>
              <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 0.5rem;">No se encontró registro para el código: <strong>${id}</strong></p>
              <a href="/" class="btn" style="margin-top: 1rem; display: inline-block; background: #2d6a4f; color: #fff; padding: 0.5rem 1rem; border-radius: 6px; text-decoration: none;">Ir al Inicio</a>
            </div>
          `;
          return;
        }

        renderDetalleAndamio(res.solicitud);
      } catch (err) {
        document.getElementById('contentArea').innerHTML = `
          <div style="padding: 2rem; text-align: center; color: #ef4444;">
            <h3>⚠️ Error de conexión</h3>
            <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 0.5rem;">No se pudo comunicar con el servidor central de ARAUCO.</p>
          </div>
        `;
      }
    });

    function renderDetalleAndamio(sol) {
      const esDeshabilitadoHSE = sol.estado === 'DESHABILITADO_HSE';
      const esHabilitado = sol.estado === 'HABILITADO';
      const esAlquiler = sol.estado === 'EN_ALQUILER';
      const esDesarme = ['DESARME_SOLICITADO', 'DESARMADO'].includes(sol.estado);

      let bannerClass = esDeshabilitadoHSE ? 'deshabilitado-hse' : esHabilitado ? 'habilitado' : esAlquiler ? 'alquiler' : 'desarme';
      let bannerText = esDeshabilitadoHSE ? '⛔ ANDAMIO DESHABILITADO POR SEGURIDAD (HSE) — PROHIBIDO SUBIR / NO OPERATIVO' :
                       esHabilitado ? '🟢 ANDAMIO HABILITADO — ESTRUCTURA SEGURA Y EN CONDICIONES' :
                       esAlquiler ? '🟡 ANDAMIO EN ALQUILER (> 30 DÍAS DE PERMANENCIA)' :
                       sol.estado === 'DESARMADO' ? '⚪ ANDAMIO DESARMADO — FUERA DE PLANTA' :
                       '🔴 DESARME SOLICITADO — NO UTILIZAR';

      const evHSE = sol.eventoSeguridadHSE;

      const content = `
        <div class="status-banner ${bannerClass}">
          ${bannerText}
        </div>

        ${esDeshabilitadoHSE && evHSE ? `
          <div style="background: rgba(220, 38, 38, 0.15); border: 2px solid #ef4444; border-radius: 8px; margin: 1rem; padding: 1rem;">
            <div style="display: flex; align-items: center; gap: 0.5rem; color: #fca5a5; font-weight: 800; font-size: 1.05rem;">
              ⚠️ CONDICIÓN INSEGURA REGISTRADA POR SEGURIDAD E HIGIENE
            </div>
            <div style="margin-top: 0.5rem; font-size: 0.9rem; color: #fff;">
              <strong>Motivo de Bloqueo:</strong> ${evHSE.motivoPrincipal || 'No-conformidad de seguridad'}
            </div>
            ${evHSE.itemsObservados && evHSE.itemsObservados.length > 0 ? `
              <div style="margin-top: 0.4rem;">
                <span style="font-size: 0.8rem; color: #fca5a5; font-weight: 600;">Deficiencias observadas en terreno:</span>
                <ul style="margin: 0.3rem 0; padding-left: 1.2rem; font-size: 0.82rem; color: #fecaca;">
                  ${evHSE.itemsObservados.map(item => `<li>${item}</li>`).join('')}
                </ul>
              </div>
            ` : ''}
            ${evHSE.observaciones ? `
              <div style="margin-top: 0.4rem; font-size: 0.85rem; color: #e2e8f0; background: rgba(0,0,0,0.3); padding: 0.5rem; border-radius: 4px;">
                <strong>Detalle del Inspector:</strong> ${evHSE.observaciones}
              </div>
            ` : ''}
            <div style="margin-top: 0.5rem; font-size: 0.78rem; color: #94a3b8;">
              Inspector HSE: <strong>${evHSE.inspectorNombre || 'Seguridad ARAUCO'}</strong> · Fecha: <strong>${new Date(evHSE.fecha).toLocaleString()}</strong>
            </div>

            ${evHSE.fotoEvidencia ? `
              <div style="margin-top: 0.75rem; text-align: center;">
                <div style="font-size: 0.78rem; color: #fca5a5; margin-bottom: 0.3rem; font-weight: 600;">📷 Registro Fotográfico del Evento / Condición Insegura:</div>
                <img src="${evHSE.fotoEvidencia}" alt="Evidencia de Seguridad" style="max-width: 100%; max-height: 240px; border-radius: 6px; border: 2px solid #ef4444;">
              </div>
            ` : ''}
            <div style="margin-top: 0.6rem; padding: 0.4rem; background: rgba(239, 68, 68, 0.2); border-radius: 4px; text-align: center; color: #fee2e2; font-size: 0.82rem; font-weight: 700;">
              🚧 La estructura debe ser modificada/reparada por la empresa contratista y re-inspeccionada antes de re-habilitar.
            </div>
          </div>
        ` : ''}

        <div class="data-grid">
          <div class="data-cell">
            <div class="cell-label">Tarjeta Única QR</div>
            <div class="cell-value" style="color: #52b788; font-size: 1.1rem;">${sol.tarjetaId}</div>
          </div>
          <div class="data-cell">
            <div class="cell-label">Solicitud Oficial</div>
            <div class="cell-value">${sol.numeroCorrelativo}</div>
          </div>

          <div class="data-cell full">
            <div class="cell-label">Ubicación Técnica Exacta</div>
            <div class="cell-value" style="font-size: 1.05rem;">📍 ${sol.ubicacionTecnica}</div>
            <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 0.2rem;">Sector: <strong>${sol.sector}</strong> · Centro de Costos: ${sol.centroCostos}</div>
          </div>

          <div class="data-cell">
            <div class="cell-label">Volumen Real Auditado</div>
            <div class="cell-value" style="color: #93c5fd;">${sol.totalVolumenRealM3 || sol.dimSolicitadaAndamio?.volumenM3 || 0} m³</div>
          </div>
          <div class="data-cell">
            <div class="cell-label">Superficie Plataformas</div>
            <div class="cell-value" style="color: #93c5fd;">${sol.totalSuperficieRealM2 || sol.dimSolicitadaPlataforma?.superficieM2 || 0} m²</div>
          </div>

          <div class="data-cell">
            <div class="cell-label">Empresa Ejecutante</div>
            <div class="cell-value">${sol.proveedorAsignado || 'No asignada'}</div>
          </div>
          <div class="data-cell">
            <div class="cell-label">Régimen Horario Real</div>
            <div class="cell-value">${sol.regimenHorarioReal || sol.regimenHorarioEstimado || 'HABIL'}</div>
          </div>

          <div class="data-cell full">
            <div class="cell-label">Vigencia y Semáforo de Permanencia (Regla 30 días ARAUCO)</div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.3rem;">
              <div>
                <span style="font-size: 0.8rem; color: #94a3b8;">Habilitado el:</span> 
                <strong>${sol.fechaArmado ? sol.fechaArmado.split('T')[0] : 'En fecha de orden'}</strong>
              </div>
              <div>
                <span style="font-size: 0.8rem; color: #94a3b8;">Días activo:</span> 
                <strong style="font-size: 1.1rem; color: ${sol.diasPermanencia > 30 ? '#f59e0b' : '#10b981'};">${sol.diasPermanencia || 1} días</strong>
              </div>
            </div>
            ${sol.fechaLimite30Dias ? `
              <div style="font-size: 0.78rem; color: #94a3b8; margin-top: 0.3rem;">
                Fecha límite marcha normal (30 días): <strong>${sol.fechaLimite30Dias.split('T')[0]}</strong>
              </div>
            ` : ''}
          </div>

          ${sol.fotoAndamioMontado ? `
            <div class="data-cell full">
              <div class="cell-label">Fotografía de Respaldo del Montaje</div>
              <div style="margin-top: 0.5rem; text-align: center;">
                <img src="${sol.fotoAndamioMontado}" alt="Andamio Montado" style="max-width: 100%; max-height: 220px; border-radius: 6px; border: 1px solid #334155;">
              </div>
            </div>
          ` : ''}

          <div class="data-cell full">
            <div class="cell-label" style="display: flex; justify-content: space-between;">
              <span>Checklist de Seguridad (11 Puntos Oficiales)</span>
              <span style="color: #10b981; font-weight: bold;">✔ 100% CUMPLIDO</span>
            </div>
            <ul class="checklist-list" style="margin-top: 0.5rem;">
              ${CHECKLIST_TEXTOS.map((t, idx) => `
                <li class="checklist-item">
                  <span style="color: #10b981; font-weight: bold;">✔</span>
                  <span><strong>${idx + 1}.</strong> ${t}</span>
                </li>
              `).join('')}
            </ul>
          </div>
        </div>

        <div style="padding: 1rem 1.25rem; background: #0f172a; border-top: 1px solid #334155; display: flex; justify-content: space-between; align-items: center;">
          <div style="font-size: 0.8rem; color: #94a3b8;">
            Auditado en Planta Industrial ARAUCO
          </div>
          <button onclick="window.print()" class="btn btn-outline" style="font-size: 0.8rem; padding: 0.35rem 0.75rem; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 6px; cursor: pointer;">
            🖨️ Imprimir Ficha
          </button>
        </div>
      `;

      document.getElementById('contentArea').innerHTML = content;
    }
  </script>
</body>
</html>
