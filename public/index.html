<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Andamios ARAUCO - PWA</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1b4332">
  <link rel="stylesheet" href="/styles.css?v=1.1.1">
</head>
<body>

  <!-- Barra Superior Compacta (h-14 / 56px) -->
  <header class="navbar-h14">
    <div class="brand-compact">
      <span class="brand-badge">arauco</span>
      <div class="brand-text-group">
        <span class="brand-title-compact">Gestión de Provisión de Andamios</span>
        <span class="brand-sub-inline">Trazabilidad · Habilitación · Certificación</span>
      </div>
    </div>

    <!-- Controles Derecha: Buscador QR + UserMenu Dropdown Compacto -->
    <div class="navbar-actions">
      <button class="btn-scanner-clean" id="btnHeaderScanner" onclick="abrirBuscadorEscaneoQR()" title="Buscar Andamio o Escanear Código QR con Cámara">
        <span style="font-size: 1rem;">📷</span>
        <span>Buscar / Escanear QR</span>
      </button>

      <!-- UserMenu Dropdown Compacto -->
      <div class="user-menu-wrapper" id="userMenuWrapper" style="display: none;">
        <button class="user-menu-trigger" id="userMenuTrigger" onclick="toggleUserDropdown(event)" title="Opciones de Perfil">
          <div class="user-avatar-circle" id="userAvatarCircle">DA</div>
          <div class="user-menu-info">
            <span class="user-name-short" id="activeUserNameShort">Usuario</span>
            <span class="user-role-short" id="activeRoleBadgeShort">Rol</span>
          </div>
          <svg class="dropdown-chevron" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
          </svg>
        </button>

        <!-- Menú Desplegable -->
        <div class="user-dropdown-menu" id="userDropdownMenu" style="display: none;">
          <div class="dropdown-user-header">
            <div class="font-bold text-white text-sm" id="dropdownFullName">Usuario ARAUCO</div>
            <div class="text-xs text-slate-400" id="dropdownRoleInfo">Planta Industrial</div>
          </div>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item" id="btnDropdownToggleModo" onclick="toggleModoAdminFromDropdown()" style="display: none;">
            <span class="dropdown-icon">📝</span>
            <span id="btnDropdownToggleModoText">Modo Solicitante</span>
          </button>
          <button class="dropdown-item" id="btnDropdownCambiarClave" onclick="abrirModalCambiarPassword(); closeUserDropdown();">
            <span class="dropdown-icon">🔑</span>
            <span>Cambiar Clave</span>
          </button>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item text-rose-400" id="btnDropdownLogout" onclick="logoutUsuario()">
            <span class="dropdown-icon">🔒</span>
            <span>Cerrar Sesión</span>
          </button>
        </div>
      </div>

      <!-- Contenedor de compatibilidad oculto -->
      <div id="userBar" style="display: none;">
        <span id="activeRoleBadge"></span>
        <span id="activeUserName"></span>
        <button id="btnCambiarClave" style="display: none;"></button>
        <button id="btnLogout" style="display: none;"></button>
      </div>
    </div>
  </header>

  <!-- Contenido Principal Dinámico -->
  <main id="appContainer">
    <div style="text-align: center; padding: 3rem; color: #a0aec0;">
      <div class="spinner" style="margin: 0 auto 1rem; width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #2d6a4f; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
      Cargando Sistema de Gestión de Andamios ARAUCO...
    </div>
  </main>

  <!-- Área Oculta para Impresión Oficial de Planilla ARAUCO y Tarjetas QR -->
  <div id="impresionPlanillaArea" style="display: none;"></div>
  <div id="impresionTarjetaArea" style="display: none;"></div>

  <footer>
    ARAUCO Planta Industrial · Sistema Oficial de Provisión de Andamios N° 01-XXXXXXXX · Versión PWA 1.0.0
  </footer>

  <script>
    // Limpieza de cachés de service workers antiguos
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        for (let reg of regs) {
          reg.update();
        }
      });
    }
  </script>
  <script src="/html5-qrcode.min.js"></script>
  <script src="/qrcode.js"></script>
  <script src="/app.js?v=1.1.1"></script>
</body>
</html>
