<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Andamios ARAUCO - PWA</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1b4332">
  <link rel="stylesheet" href="/styles.css?v=1.0.7">
</head>
<body>

  <!-- Barra Superior -->
  <header>
    <div class="brand">
      <span class="brand-badge">arauco</span>
      <div>
        <div class="brand-title">Gestión de Provisión de Andamios</div>
        <div class="brand-sub">Trazabilidad · Habilitación · Certificación Oficial</div>
      </div>
    </div>

    <!-- Barra de Usuario Activo -->
    <div class="user-bar" id="userBar" style="display: none;">
      <span id="activeRoleBadge" class="role-badge">ROL</span>
      <span id="activeUserName" style="font-weight: 600; font-size: 0.9rem;">Usuario</span>
      <button class="btn btn-outline" id="btnCambiarClave" style="font-size: 0.8rem; padding: 0.35rem 0.6rem;" onclick="abrirModalCambiarPassword()" title="Cambiar clave de mi usuario">🔑 Cambiar Clave</button>
      <button class="btn btn-outline" id="btnLogout" title="Salir del sistema de forma segura">🔒 Cerrar Sesión</button>
    </div>
  </header>

  <!-- Contenido Principal Dinámico -->
  <main id="appContainer">
    <div style="text-align: center; padding: 3rem; color: #a0aec0;">
      <div class="spinner" style="margin: 0 auto 1rem; width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #2d6a4f; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
      Cargando Sistema de Gestión de Andamios ARAUCO...
    </div>
  </main>

  <!-- Área Oculta para Impresión Oficial de Planilla ARAUCO y Tarjetas QR -->
  <div id="impresionPlanillaArea" style="display: none;"></div>
  <div id="impresionTarjetaArea" style="display: none;"></div>

  <footer>
    ARAUCO Planta Industrial · Sistema Oficial de Provisión de Andamios N° 01-XXXXXXXX · Versión PWA 1.0.0
  </footer>

  <script>
    // Limpieza de cachés de service workers antiguos
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        for (let reg of regs) {
          reg.update();
        }
      });
    }
  </script>
  <script src="/qrcode.js"></script>
  <script src="/app.js?v=1.0.7"></script>
</body>
</html>
